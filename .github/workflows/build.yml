name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: unzip -o ZionBibleVerse-Android.zip

      # Permanent signing key from repository secrets, so each build installs as an update.
      - name: Restore signing key
        run: echo "${{ secrets.ZION_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/zion-release.jks"

      - name: Build both apps (members + admin)
        working-directory: ZionBibleVerse
        env:
          ZION_KEYSTORE: ${{ runner.temp }}/zion-release.jks
          ZION_KEYSTORE_PASSWORD: ${{ secrets.ZION_KEYSTORE_PASSWORD }}
          ZION_KEY_ALIAS: zion
        run: |
          chmod +x gradlew
          ./gradlew assembleUserRelease assembleAdminRelease --no-daemon
          cp app/build/outputs/apk/user/release/app-user-release.apk ../ZionBibleVerse.apk
          cp app/build/outputs/apk/admin/release/app-admin-release.apk ../ZionAdmin.apk

      # ZionBibleVerse.apk keeps the same name, so the printed QR code keeps working.
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zion Bible Verse (build ${{ github.run_number }})
          files: |
            ZionBibleVerse.apk
            ZionAdmin.apk
